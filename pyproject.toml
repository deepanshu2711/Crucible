[project]
name = "crucible"
version = "0.1.0"
description = "Eval harness that runs agents against versioned datasets and scores them"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "requests>=2.31",
]

[project.scripts]
crucible = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["main.py", "stats.py", "telemetry.py"]

[tool.pyright]
venvPath = "."
venv = ".venv"
